<text x="434.0" y="20" fill="#9aa1ad" font-family="sans-serif" font-size="13" text-anchor="middle">sudo lnd-wallet: new wallet, restore, channels, undo</text>
<g font-family="ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" xml:space="preserve">
<text x="14.0" y="56.5" fill="#d6d9e0">✅</text>
<text x="30.8" y="56.5" fill="#d6d9e0" textLength="226.8" lengthAdjust="spacingAndGlyphs"> &#x27;jq&#x27; is already installed.</text>
<text x="14.0" y="90.5" fill="#d6d9e0" textLength="193.2" lengthAdjust="spacingAndGlyphs">What do you want to do?</text>
<text x="14.0" y="107.5" fill="#d6d9e0" textLength="126.0" lengthAdjust="spacingAndGlyphs">  1) New wallet</text>
<text x="14.0" y="124.5" fill="#d6d9e0" textLength="453.6" lengthAdjust="spacingAndGlyphs">  2) Restore the wallet (on-chain funds) from its seed</text>
<text x="14.0" y="141.5" fill="#d6d9e0" textLength="537.6" lengthAdjust="spacingAndGlyphs">  3) Restore the wallet and the channels (seed + channel.backup)</text>
<text x="14.0" y="158.5" fill="#d6d9e0" textLength="596.4" lengthAdjust="spacingAndGlyphs">  4) Restore the channels into the running wallet (channel.backup only)</text>
<text x="14.0" y="175.5" fill="#d6d9e0" textLength="294.0" lengthAdjust="spacingAndGlyphs">  5) Undo: put a safety backup back</text>
<text x="14.0" y="192.5" fill="#d6d9e0" textLength="92.4" lengthAdjust="spacingAndGlyphs">Choose 1-5:</text>
</g></svg>
